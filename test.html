<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OH Storm - Connection Test</title>
<style>
  :root{ --navy:#19144E; --green:#077D40; --err:#b00020; --bg:#F6F7FB; }
  *{ box-sizing:border-box; }
  body{ background:var(--bg); color:var(--navy); margin:0; padding:20px;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card{ background:#fff; border-radius:14px; padding:22px; max-width:560px; margin:0 auto;
         box-shadow:0 2px 14px rgba(25,20,78,.10); }
  .bar{ height:5px; width:60px; border-radius:3px; margin-bottom:18px;
        background:linear-gradient(90deg,var(--navy),var(--green)); }
  h1{ font-size:19px; margin:0 0 6px; }
  p{ font-size:14px; color:#4a4a63; line-height:1.5; }
  button{ background:var(--green); color:#fff; border:0; border-radius:9px;
          padding:13px 22px; font-size:16px; font-weight:600; width:100%; margin-top:8px; }
  pre{ background:#0f0f1e; color:#d6f5e0; padding:14px; border-radius:9px;
       font-size:12px; white-space:pre-wrap; word-break:break-all; margin-top:16px; max-height:340px; overflow:auto; }
  .verdict{ font-weight:700; font-size:16px; padding:14px; border-radius:9px; margin-top:16px; }
  .pass{ background:#e6f6ec; color:var(--green); }
  .fail{ background:#fdecef; color:var(--err); }
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <h1>OH Storm connection test</h1>
  <p>This checks whether a page hosted outside Google can pull data from the Apps Script
     backend. It does not change anything. Tap the button, then send back what appears.</p>
  <button id="run">Run the test</button>
  <div id="verdict"></div>
  <pre id="log">Ready.</pre>
</div>

<script>
  // Same /exec URL as the app. doGet() routes anything with ?action= to
  // handleDataRequest_, which returns JSON instead of the HTML page.
  var APP_URL = "https://script.google.com/macros/s/AKfycbxR_4vXZOZnCYuvOqMZIhyrzjKyCGJ7PFhAccJLkOohMsLQImkhvNb4KJbLsvLJSedqjw/exec";

  var logEl = document.getElementById('log');
  var verdictEl = document.getElementById('verdict');
  function log(s){ logEl.textContent += "\n" + s; }

  document.getElementById('run').onclick = function(){
    logEl.textContent = "Testing...";
    verdictEl.innerHTML = "";
    log("Origin: " + window.location.origin);
    log("Calling: ...&action=getLoginNames");

    fetch(APP_URL + "?action=getLoginNames")
      .then(function(r){
        log("HTTP status: " + r.status);
        log("Final URL: " + r.url);
        return r.text();
      })
      .then(function(t){
        log("First 300 chars of response:");
        log(t.substring(0, 300));
        if (t.trim().charAt(0) === "<") {
          verdictEl.className = "verdict fail";
          verdictEl.textContent = "FAIL - got an HTML page, not data.";
        } else {
          try {
            var d = JSON.parse(t);
            verdictEl.className = "verdict pass";
            verdictEl.textContent = "PASS - real data came back. "
              + (d.names ? d.names.length + " names loaded." : "");
          } catch (err) {
            verdictEl.className = "verdict fail";
            verdictEl.textContent = "FAIL - response was not valid JSON.";
          }
        }
      })
      .catch(function(err){
        log("Request blocked: " + err);
        verdictEl.className = "verdict fail";
        verdictEl.textContent = "FAIL - the request was blocked (likely CORS).";
      });
  };
</script>
</body>
</html>
