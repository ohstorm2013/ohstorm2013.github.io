  <style>
    :root {
      --navy:#19144E; --navy-soft:#2a2470; --green:#077D40; --green-deep:#055f31;
      --field:#F6F7FB; --card:#FFFFFF; --line:#E7E9F2; --muted:#6B7088; --ink:#1B1C2E;
      --mist:#EAF5EE; --mist-line:#C6E6D2; --err:#b00020; --miss:#C0392B; --misswash:#FBECEA;
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; margin:0;
      padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 24px);
      color:var(--ink); background:var(--field); line-height:1.45; -webkit-text-size-adjust:100%; }
    .wrap { max-width:560px; margin:0 auto; }
    .stormbar { height:4px; border-radius:999px; background:linear-gradient(90deg,var(--navy),var(--green)); margin-bottom:14px; }
    h1 { font-size:22px; margin:0 0 4px; color:var(--navy); font-weight:800; letter-spacing:-.01em; }
    h2 { font-size:15px; margin:0 0 10px; color:var(--navy); font-weight:800; }
    .sub { color:var(--muted); font-size:13px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 2px 12px rgba(25,20,78,.05); }
    .muted { color:var(--muted); } .err { color:var(--err); } .ok { color:var(--green); }
    label { display:block; font-size:13px; font-weight:700; margin:12px 0 5px; color:var(--navy); }
    input, select { width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
    button { font:inherit; font-weight:700; border:none; border-radius:12px; cursor:pointer; color:var(--ink); }
    .big { display:block; width:100%; background:var(--green); color:#fff; padding:15px; font-size:16px; margin-top:12px; }
    .big.navy { background:var(--navy); }
    .big:disabled { opacity:.4; }
    .ghost { display:block; width:100%; background:transparent; color:var(--muted); border:1px solid var(--line); padding:12px; font-size:14px; margin-top:12px; }
    .msg { font-size:13px; margin-top:10px; min-height:18px; }
    .menu { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:10px; }
    .menu .t { font-size:16px; color:var(--navy); font-weight:800; }
    .menu .d { font-size:13px; color:var(--muted); font-weight:500; margin-top:2px; }
    .row { display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
    .row:last-child { border-bottom:none; }
    .row .grow { flex:1; }
    .pill { font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; background:#F0F1F7; color:var(--muted); white-space:nowrap; }
    .pill.live { background:var(--mist); color:var(--green-deep); }

    /* ---- charting ---- */
    .chhead { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .chhead .who { flex:1; min-width:0; }
    .chhead .who .p { font-weight:800; color:var(--navy); font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chhead .who .g { font-size:12px; color:var(--muted); }
    .sync { font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px; background:var(--mist); color:var(--green-deep); white-space:nowrap; }
    .sync.wait { background:#FFF4D6; color:#8a6300; }
    .pnum { text-align:center; font-size:34px; font-weight:900; color:var(--navy); letter-spacing:-.02em; margin:2px 0 8px; }
    .pnum small { display:block; font-size:12px; color:var(--muted); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .hm { display:grid; grid-template-columns:1fr; gap:12px; margin-top:6px; }
    .hm button { padding:30px 10px; font-size:26px; font-weight:900; border-radius:18px; letter-spacing:.02em; color:#fff; }
    .hm .hit { background:var(--green); } .hm .hit:active { background:var(--green-deep); }
    .hm .mis { background:var(--miss); } .hm .mis:active { background:#9b2d21; }
    .hm button small { display:block; font-size:13px; font-weight:600; opacity:.9; letter-spacing:0; margin-top:2px; }
    .strip { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:14px; min-height:28px; }
    .strip span { font-size:12px; font-weight:800; padding:4px 9px; border-radius:999px; }
    .strip .h { background:var(--mist); color:var(--green-deep); } .strip .m { background:var(--misswash); color:#8c2a1f; }
    .running { text-align:center; font-size:13px; color:var(--muted); margin-top:8px; }

    /* ---- Ohio Storm look: same navy/green, white cards, storm bar as the homework app ---- */
    .brand { display:flex; align-items:center; gap:12px; margin:2px 0 14px; }
    .blogo { width:96px; height:69px; background:var(--logo) center/contain no-repeat; flex-shrink:0; }
    .btext b { display:block; font-size:12px; letter-spacing:.14em; color:var(--green); font-weight:900; }
    .btext span { font-size:13px; color:var(--muted); font-weight:600; }
    body[data-screen=login] .brand, body[data-screen=chart] .brand { display:none; }
    .pcard { background:var(--card); border-radius:22px; padding:26px 24px 24px; margin:14px auto 12px; box-shadow:0 6px 28px rgba(25,20,78,.10); border:1px solid var(--line); position:relative; overflow:hidden; }
    .pcard::before { content:""; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--navy),var(--green)); }
    .loginlogo { width:190px; height:136px; margin:6px auto 4px; background:var(--logo) center/contain no-repeat; }
    .pcard h1 { text-align:center; margin:0; font-size:23px; }
    .pcard .tag2 { text-align:center; font-size:11.5px; letter-spacing:.16em; color:var(--green); font-weight:900; margin:2px 0 14px; text-transform:uppercase; }
    .phello { text-align:center; color:var(--muted); font-size:14px; margin-bottom:6px; }
    .foot { text-align:center; font-size:11.5px; color:#9A9EB5; font-weight:600; margin-top:22px; letter-spacing:.04em; }
    .welcome { background:linear-gradient(120deg,var(--navy) 0%,var(--navy-soft) 55%,var(--green) 130%); color:#fff; border-radius:20px; padding:20px 20px 18px; margin-bottom:16px; box-shadow:0 8px 22px rgba(25,20,78,.20); position:relative; overflow:hidden; }
    .welcome::after { content:""; position:absolute; right:-34px; top:-34px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.07); }
    .welcome .hi { font-size:26px; font-weight:900; letter-spacing:-.02em; }
    .welcome .hs { font-size:13.5px; color:#cfd0ee; margin-top:2px; }
    .menu { display:flex; align-items:center; gap:14px; padding:14px 14px; border-radius:16px; box-shadow:0 2px 12px rgba(25,20,78,.05); }
    .menu:active { background:#F3F5FB; }
    .menu .ico { width:46px; height:46px; border-radius:13px; background:var(--navy); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .menu .ico.go { background:var(--green); }
    .menu .ico svg { width:24px; height:24px; stroke:#fff; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .menu .mt { flex:1; min-width:0; }
    .menu .chev2 { color:#B3B7CC; font-size:22px; font-weight:400; }
    .board { background:linear-gradient(125deg,var(--navy) 0%,var(--navy-soft) 100%); color:#fff; border-radius:20px; padding:16px 18px 14px; margin-bottom:12px; display:flex; align-items:center; gap:12px; box-shadow:0 8px 22px rgba(25,20,78,.22); border-bottom:5px solid var(--green); }
    .board .who { flex:1; min-width:0; }
    .board .lbl { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#8fe3b4; font-weight:900; }
    .board .nm { font-size:21px; font-weight:900; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .board .op { font-size:12.5px; color:#cfd0ee; margin:1px 0 8px; }
    .board .pn { text-align:right; }
    .board .pn .l { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:#8fe3b4; font-weight:900; }
    .board .pn .v { font-size:52px; font-weight:900; line-height:1; letter-spacing:-.03em; }
    .hm .hit { box-shadow:0 8px 18px rgba(7,125,64,.28); } .hm .mis { box-shadow:0 8px 18px rgba(192,57,43,.25); }
    .kpis .kpi.hero { background:linear-gradient(135deg,var(--navy),var(--navy-soft)); border-color:var(--navy); }
    .kpis .kpi.hero .v { color:#fff; } .kpis .kpi.hero .l { color:#8fe3b4; }
    .tools button { box-shadow:0 1px 0 rgba(25,20,78,.04); }
    .seg { display:flex; background:#E8EBF5; border-radius:13px; padding:4px; margin-bottom:14px; }
    .seg button { flex:1; background:transparent; color:var(--navy); padding:10px 6px; border-radius:10px; font-size:14px; }
    .seg button.on { background:var(--navy); color:#fff; box-shadow:0 2px 8px rgba(25,20,78,.2); }
    .mxwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -6px; }
    table.mx { border-collapse:separate; border-spacing:0; width:100%; font-size:13px; }
    .mx th, .mx td { padding:9px 6px; text-align:center; border-bottom:1px solid var(--line); white-space:nowrap; }
    .mx th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; background:#fff; }
    .mx th.p { cursor:pointer; color:var(--navy); }
    .mx .g { position:sticky; left:0; background:#fff; text-align:left; min-width:122px; max-width:122px; overflow:hidden; text-overflow:ellipsis; z-index:1; box-shadow:2px 0 0 rgba(25,20,78,.06); }
    .mx td.c b { display:block; font-size:15px; color:var(--ink); }
    .mx td.c small { display:block; font-size:10.5px; color:var(--muted); }
    .mx tr.season td { background:#EEF1F9; font-weight:800; }
    .mx tr.season td.g { background:#EEF1F9; }
    .mx tr.game { cursor:pointer; }
    .mx tr.off td { opacity:.5; }
    .mx td.team, .mx th.team { border-left:2px solid var(--line); }
    .mx .gname { font-weight:800; color:var(--navy); overflow:hidden; text-overflow:ellipsis; }
    .mx .gsub { font-size:11px; color:var(--muted); font-weight:600; }
    .toggle { width:46px; height:27px; border-radius:999px; background:#D5D8E6; border:none; padding:0; position:relative; cursor:pointer; flex-shrink:0; transition:background .18s; }
    .toggle.on { background:var(--green); }
    .toggle .knob { position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:left .18s; }
    .toggle.on .knob { left:22px; }
    .row.off { opacity:.55; }
    .legend { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); font-weight:700; padding:0 2px 8px; border-bottom:1px solid var(--line); }
    .logrow { display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); }
    .logrow:last-child { border-bottom:none; }
    .logrow .num { font-weight:900; color:var(--navy); width:44px; }
    .logrow .grow { flex:1; }
    .tag { font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px; }
    .tag.h { background:var(--mist); color:var(--green-deep); } .tag.m { background:var(--misswash); color:#8c2a1f; }
    .logrow button { padding:9px 11px; font-size:13px; background:#EEF1F9; color:var(--navy); }
    .logrow button.rm { background:transparent; color:var(--miss); }
    .tools { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
    .tools button { background:#EEF1F9; color:var(--navy); padding:12px 6px; font-size:13px; }
    .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translateX(-50%); background:var(--navy); color:#fff; padding:10px 18px; border-radius:999px; font-weight:700; font-size:14px; box-shadow:0 6px 20px rgba(0,0,0,.2); opacity:0; transition:opacity .2s; pointer-events:none; z-index:9; }
    .toast.show { opacity:1; }
    .slidein { animation:slidein .22s ease-out; }
    @keyframes slidein { from { transform:translateX(28px); opacity:0; } to { transform:none; opacity:1; } }

    /* ---- stats ---- */
    .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .kpi { background:var(--field); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
    .kpi .v { font-size:24px; font-weight:900; color:var(--navy); }
    .kpi .l { font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em; }
    .kpi.hero .v { color:var(--green); }
    .bars .b { display:grid; grid-template-columns:92px 1fr 64px; gap:8px; align-items:center; font-size:13px; margin:7px 0; }
    .bars .track { height:10px; background:var(--line); border-radius:999px; overflow:hidden; }
    .bars .fill { height:100%; background:linear-gradient(90deg,var(--navy),var(--green)); }
    .bars .fill.low { background:var(--miss); }
    .bars .n { text-align:right; color:var(--muted); font-size:12px; }
    .bars .n b { color:var(--ink); }
    .callout { background:var(--mist); border:1px solid var(--mist-line); color:var(--green-deep); border-radius:12px; padding:10px 12px; font-size:13.5px; margin-top:10px; }
    textarea { width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); min-height:70px; resize:vertical; }
    .note { background:#FFFBEA; border:1px solid #F1E3A6; border-radius:12px; padding:10px 12px; margin-top:8px; font-size:14.5px; color:var(--ink); }
    .note .by { font-size:12px; color:var(--muted); margin-top:4px; display:flex; justify-content:space-between; gap:8px; }
    .note .x { border:0; background:none; color:#b3261e; font-weight:800; cursor:pointer; padding:0 4px; }
    .reasons button { display:block; width:100%; text-align:left; background:#EEF1F9; color:var(--navy); padding:14px; font-size:15px; margin-top:8px; }
    .reg { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .reg span { min-width:54px; text-align:center; font-size:13px; font-weight:800; padding:7px 8px; border-radius:10px; }
    .reg .h { background:var(--mist); color:var(--green-deep); border:1px solid var(--mist-line); }
    .reg .m { background:var(--misswash); color:#8c2a1f; border:1px solid #F2C9C3; }
    .reghd { display:flex; justify-content:space-between; font-size:13px; font-weight:800; color:var(--navy); margin-top:14px; }
    .trend { width:100%; height:auto; display:block; margin-top:6px; }
    .dots { display:flex; gap:5px; justify-content:center; margin:10px 0 4px; }
    .dots i { width:16px; height:16px; border-radius:50%; background:var(--misswash); border:1px solid #F2C9C3; }
    .dots i.h { background:var(--green); border-color:var(--green); }
    .livecard { border:2px solid transparent; } .livecard.cur { border-color:var(--green); }
    .callout.warn { background:var(--misswash); border-color:#F2C9C3; color:#8c2a1f; }
    table.t { width:100%; border-collapse:collapse; font-size:13.5px; }
    table.t th { text-align:left; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; padding:6px 4px; border-bottom:2px solid var(--line); }
    table.t td { padding:10px 4px; border-bottom:1px solid var(--line); }
    table.t tr.click { cursor:pointer; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stormbar"></div>
    <div class="brand" id="brand"><div class="blogo" role="img" aria-label="Ohio Storm"></div><div class="btext"><b>PITCH TRACKER</b><span>Ohio Storm 13U</span></div></div>
    <div id="app"><div class="card muted">Loading…</div></div>
    <div class="foot">Ohio Storm 13U · Pitch Tracker</div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    /* ====================================================================
       OH STORM — PITCH TRACKER (GitHub Pages: ohstorm2013.github.io/pitch.html)

       Talks to its OWN Apps Script project (PitchApp.gs), separate from the
       homework app. Login uses the same names and PINs: that project reads
       the homework Sheet read-only. Homework's index.html is not involved.

       API_URL = the pitch tracker deployment's /exec URL (NOT the homework one).
       Do NOT paste a URL containing /u/0/ or /u/1/.
       ==================================================================== */
    var API_URL = "https://script.google.com/macros/s/AKfycbwNCj8tYpaU5cj2BB7zPS2ekeTvI9omOoCIU0Xs27GxVxdld6LAKSjKB7TvBva97F5a/exec";

    var el = function(id){ return document.getElementById(id); };
    var STATE = {
      user:null,        // {name, role}
      pin:null,         // kept in memory only, so private stats requests can prove who is asking
      cfg:null,         // {pitchers:[...]}
      game:null,        // {id, date, opponent, status}
      serverCounts:{},  // pitcher -> highest pitch # already saved for this game
      pitcher:null, num:1, inning:1,
      history:[]        // pitches charted on THIS phone this game (for Undo)
    };

    /* ---------------- api(): same as index.html ---------------- */
    function api(action, params, onSuccess, onFailure, opts){
      onFailure = onFailure || function(){};
      opts = opts || {};
      var maxTries = opts.tries || 3, timeoutMs = opts.timeout || 25000;
      var qs = "?action=" + encodeURIComponent(action);
      params = params || {};
      for (var k in params){
        if (!params.hasOwnProperty(k)) continue;
        var v = params[k];
        if (v === null || v === undefined) v = "";
        if (typeof v === "object") v = JSON.stringify(v);
        qs += "&" + encodeURIComponent(k) + "=" + encodeURIComponent(v);
      }
      var url = API_URL + qs;
      function attempt(tryNo){
        var settled = false;
        var timer = setTimeout(function(){ if (settled) return; settled = true; retryOrFail(tryNo, new Error("The server is taking too long.")); }, timeoutMs);
        fetch(url + "&_t=" + Date.now())
          .then(function(r){ return r.text(); })
          .then(function(t){
            if (settled) return; settled = true; clearTimeout(timer);
            if (t && t.trim().charAt(0) === "<"){ retryOrFail(tryNo, new Error("Could not reach the app server.")); return; }
            var d; try { d = JSON.parse(t); } catch(e){ retryOrFail(tryNo, new Error("Unexpected response from the server.")); return; }
            if (d && d.ok){ onSuccess(d); return; }
            onFailure(new Error((d && d.error) || "Something went wrong."));
          })
          .catch(function(){ if (settled) return; settled = true; clearTimeout(timer); retryOrFail(tryNo, new Error("No connection. Check your signal and try again.")); });
      }
      function retryOrFail(tryNo, err){
        if (tryNo < maxTries) setTimeout(function(){ attempt(tryNo + 1); }, 1200 * tryNo);
        else onFailure(err);
      }
      attempt(1);
    }
    // Private requests (stats) carry name + PIN; the server re-checks them every time.
    function authApi(action, params, onSuccess, onFailure, opts){
      params = params || {};
      params.name = STATE.user ? STATE.user.name : ''; params.pin = STATE.pin || '';
      api(action, params, onSuccess, onFailure, opts);
    }
    try { fetch(API_URL + "?action=getLoginNames&_warm=" + Date.now()); } catch(e){}

    /* ----------------------------------------------------------------
       OFFLINE PITCH QUEUE
       Deliberate exception to the "no localStorage" rule, used ONLY for
       pitches that have not reached the server yet. Dugout signal is bad
       and Apps Script has cold starts; a kid must never wait between
       pitches, and a locked phone or refresh must not lose an inning.
       Each pitch has an id made here, so a re-sent batch never
       double-counts (the server skips ids it already has).
       ---------------------------------------------------------------- */
    var QKEY = "ohsPitchQueue", SKEY = "ohsPitchSession";
    var memQueue = [];
    function loadQ(){ try { var v = localStorage.getItem(QKEY); return v ? JSON.parse(v) : memQueue; } catch(e){ return memQueue; } }
    function saveQ(q){ memQueue = q; try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch(e){} renderSync(); }
    function saveSession(){ try { localStorage.setItem(SKEY, JSON.stringify({ game:STATE.game, pitcher:STATE.pitcher, user:STATE.user && STATE.user.name })); } catch(e){} }
    function loadSession(){ try { var v = localStorage.getItem(SKEY); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
    function clearSession(){ try { localStorage.removeItem(SKEY); } catch(e){} }

    var syncing = false;
    function syncNow(){
      var q = loadQ();
      if (syncing || !q.length) return;
      syncing = true;
      var batch = q.slice(0, 5);   // small batches keep the URL short
      api('pt_addPitches', { payload:{ pitches:batch } },
        function(d){
          syncing = false;
          var saved = {}; (d.data.saved || []).forEach(function(id){ saved[id] = true; });
          saveQ(loadQ().filter(function(p){ return !saved[p.id]; }));
          if (loadQ().length) setTimeout(syncNow, 300);
        },
        function(){ syncing = false; renderSync(); },
        { tries:1, timeout:30000 });
    }
    setInterval(syncNow, 5000);
    window.addEventListener('online', syncNow);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) syncNow(); });
    syncNow();

    function renderSync(){
      var s = el('syncBadge'); if (!s) return;
      var n = loadQ().length;
      if (n){ s.className = 'sync wait'; s.textContent = n + ' waiting to sync'; }
      else { s.className = 'sync'; s.textContent = 'All saved ✓'; }
    }

    function toast(t){ var x = el('toast'); x.textContent = t; x.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ x.classList.remove('show'); }, 1300); }
    // setApp._next = 'login' | 'chart' picks which header the screen shows (the logo header is hidden on both).
    function setApp(html, anim){
      document.body.setAttribute('data-screen', setApp._next || 'plain'); setApp._next = null;
      el('app').innerHTML = '<div class="'+(anim?'slidein':'')+'">'+html+'</div>'; window.scrollTo(0,0);
    }

    /* ======================= LOGIN ======================= */
    function loginShell(inner){
      return '<div class="pcard"><div class="loginlogo" role="img" aria-label="Ohio Storm"></div><h1>Pitch Tracker</h1><div class="tag2">Ohio Storm 13U</div>'+inner+'</div>';
    }
    function showLogin(){
      setApp._next = 'login';
      setApp(loginShell('<div class="phello">Same name and PIN as the homework app.</div><div class="muted" style="text-align:center;margin-top:12px;font-size:13px;">Waking up the app… this can take a few seconds the first time.</div>'));
      api('getLoginNames', {}, function(d){
        var opts = '<option value="">— Select Your Name —</option>';
        (d.names || []).forEach(function(n){ opts += '<option value="'+esc(n)+'">'+esc(n)+'</option>'; });
        setApp._next = 'login';
        setApp(loginShell('<div class="phello">Select your name and enter your PIN to start.</div>'+
          '<label for="ln">Your name</label><select id="ln">'+opts+'</select>'+
          '<label for="lp">PIN</label><input id="lp" autocomplete="off" autocapitalize="off" placeholder="your PIN">'+
          '<button class="big" id="lb" onclick="doLogin()">Go</button><div class="msg" id="lm"></div>'));
      }, function(){
        setApp._next = 'login';
        setApp(loginShell('<div class="err" style="text-align:center;">Could not load names.</div><button class="big" onclick="showLogin()">Try again</button>'));
      });
    }
    function doLogin(){
      var name = el('ln').value, pin = el('lp').value.trim(), m = el('lm');
      if (!name){ m.textContent = 'Pick your name first.'; m.className = 'msg err'; return; }
      if (!pin){ m.textContent = 'Enter your PIN.'; m.className = 'msg err'; return; }
      var b = el('lb'); b.disabled = true; b.textContent = 'Checking…';
      api('login', { name:name, pin:pin }, function(res){
        STATE.user = { name:res.name, role:res.role }; STATE.pin = pin;
        loadConfig(showHome);
      }, function(err){ b.disabled = false; b.textContent = 'Go'; m.textContent = errMsg(err); m.className = 'msg err'; });
    }
    function loadConfig(then){
      if (STATE.cfg){ then(); return; }
      api('pt_config', {}, function(d){ STATE.cfg = d.data; then(); },
        function(err){ setApp('<div class="card err">'+esc(errMsg(err))+'</div><button class="big" onclick="loadConfig(showHome)">Try again</button>'); });
    }
    function signOut(){ STATE.user = null; STATE.pin = null; STATE.game = null; STATE.pitcher = null; STATE.history = []; showLogin(); }

    /* ======================= HOME ======================= */
    var ICONS = {"target": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><circle cx=\"12\" cy=\"12\" r=\"5\"/><circle cx=\"12\" cy=\"12\" r=\"1.2\" fill=\"#fff\"/></svg>", "staff": "<svg viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"8\" r=\"3\"/><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"/><circle cx=\"17\" cy=\"9\" r=\"2.5\"/><path d=\"M17 14.5c2.5 0 4.5 2 4.5 4.5\"/></svg>", "list": "<svg viewBox=\"0 0 24 24\"><path d=\"M5 4h14v16H5z\"/><path d=\"M8 9h8M8 13h8M8 17h5\"/></svg>", "bars": "<svg viewBox=\"0 0 24 24\"><path d=\"M5 20V11M12 20V4M19 20v-6\"/></svg>", "play": "<svg viewBox=\"0 0 24 24\"><path d=\"M8 5l11 7-11 7z\" fill=\"#fff\"/></svg>"};
    function menuBtn(icon, title, desc, onclick, go){
      return '<button class="menu" onclick="'+onclick+'"><span class="ico'+(go ? ' go' : '')+'">'+ICONS[icon]+'</span><span class="mt"><div class="t">'+title+'</div><div class="d">'+desc+'</div></span><span class="chev2">›</span></button>';
    }
    function showHome(){
      var u = STATE.user, first = u.name.split(' ')[0];
      var isPitcher = STATE.cfg.pitchers.indexOf(u.name) !== -1;
      var h = '<div class="welcome"><div class="hi">Hi, '+esc(first)+'</div><div class="hs">'+(u.role === 'coach' ? 'Coach view · everything in one place' : 'What are we doing today?')+'</div></div>';
      var sess = loadSession();
      if (sess && sess.game && sess.game.status !== 'final'){
        h += menuBtn('play', 'Resume charting', 'vs '+esc(sess.game.opponent)+(sess.pitcher ? ' · '+esc(sess.pitcher)+' pitching' : ''), 'resumeSession()', true);
      }
      h += menuBtn('target', 'Chart a game', 'Start a new game or join one in progress', 'showGames()');
      if (u.role === 'coach'){
        h += menuBtn('play', 'Live game', 'Watch a game as it is charted', 'showLive()');
        h += menuBtn('bars', 'Results', 'Team totals, game by game and season', 'showStaff()');
        h += menuBtn('list', 'Games &amp; teams', 'Report cards, and what counts in season stats', 'showGameList()');
      } else if (isPitcher){
        h += menuBtn('bars', 'My pitching', 'How often you hit your spots, game by game', 'showPitcher(\''+jsSafe(u.name)+'\')');
      }
      h += '<button class="ghost" onclick="signOut()">Close &amp; sign out</button>';
      setApp(h);
    }
    /* ======================= GAME SETUP ======================= */
    function showGames(){
      setApp('<h1>Chart a game</h1><div class="card muted">Loading games…</div>');
      api('pt_games', {}, function(d){
        var today = todayIso();
        var open = d.data.filter(function(g){ return g.status === 'open'; });
        var h = '<h1>Chart a game</h1><div class="sub" style="margin-bottom:14px;">If a teammate already started this game, join it instead of making a new one. <b>To join:</b> tap the game under &ldquo;Games in progress&rdquo; below (it says Join), then pick up at the pitch number it shows. Only tap &ldquo;New game&rdquo; if nobody has started this game yet.</div>';
        if (open.length){
          h += '<div class="card"><h2>Games in progress</h2>';
          open.forEach(function(g){
            h += '<div class="row" onclick="joinGame(\''+jsSafe(g.id)+'\')"><div class="grow"><b>vs '+esc(g.opponent)+'</b><div class="sub">'+esc(niceDate(g.date))+'</div></div>'+
                 '<span class="pill'+(g.date === today ? ' live' : '')+'">'+(g.date === today ? 'Join' : 'Open')+'</span></div>';
          });
          h += '</div>';
        }
        h += '<div class="card"><h2>New game</h2><label for="opp">Who are we playing?</label><input id="opp" placeholder="e.g. Ohio Hawks 13U" autocomplete="off">'+
             '<button class="big" id="ngb" onclick="newGame()">Next: pick the pitcher ›</button><div class="msg" id="ngm"></div></div>';
        h += '<button class="ghost" onclick="showHome()">‹ Back</button>';
        setApp(h);
      }, function(err){ setApp('<div class="card err">'+esc(errMsg(err))+'</div><button class="big" onclick="showGames()">Try again</button><button class="ghost" onclick="showHome()">‹ Back</button>'); });
    }
    function newGame(){
      var opp = el('opp').value.trim(), m = el('ngm');
      if (!opp){ m.textContent = 'Enter who we are playing.'; m.className = 'msg err'; return; }
      var b = el('ngb'); b.disabled = true; b.textContent = 'Starting…';
      api('pt_newGame', { opponent:opp, charter:STATE.user.name }, function(d){
        STATE.game = d.data; STATE.serverCounts = {}; STATE.history = []; STATE.pitcher = null; STATE.inning = 1;
        saveSession(); pickPitcher();
      }, function(err){ b.disabled = false; b.textContent = 'Next: pick the pitcher ›'; m.textContent = errMsg(err); m.className = 'msg err'; }, { tries:1 });
    }
    function joinGame(id, then){
      setApp('<div class="card muted">Joining game…</div>');
      api('pt_gameState', { gameId:id }, function(d){
        STATE.game = d.data.game; STATE.serverCounts = d.data.counts || {}; STATE.history = []; STATE.inning = d.data.inning || 1;
        saveSession();
        if (then) then(d.data); else if (d.data.lastPitcher) showContinue(d.data.lastPitcher); else pickPitcher();
      }, function(err){ setApp('<div class="card err">'+esc(errMsg(err))+'</div><button class="ghost" onclick="showGames()">‹ Back</button>'); });
    }
    // Handoff landing: the scorer who joins sees who is pitching and the next
    // pitch number, and continues with one tap.
    function showContinue(pitcher){
      var n = nextNumFor(pitcher);
      setApp('<h1>Pick up where they left off</h1><div class="sub" style="margin-bottom:14px;">vs '+esc(STATE.game.opponent)+'</div>'+
        '<div class="card" style="text-align:center;"><div class="sub">Pitching now</div><div style="font-size:22px;font-weight:900;color:var(--navy);">'+esc(pitcher)+'</div>'+
        '<div class="sub" style="margin-top:4px;">'+(n - 1)+' pitches charted so far</div>'+
        '<button class="big" onclick="startPitcher(\''+jsSafe(pitcher)+'\')">Continue at pitch #'+n+' ›</button>'+
        '<button class="ghost" onclick="pickPitcher()">A different pitcher is in now</button></div>'+
        '<button class="ghost" onclick="showGames()">‹ Back</button>');
    }
    function resumeSession(){
      var s = loadSession(); if (!s || !s.game) return showGames();
      joinGame(s.game.id, function(state){
        if (s.pitcher) startPitcher(s.pitcher); else pickPitcher(state.lastPitcher);
      });
    }
    function pickPitcher(suggest){
      var changing = !!STATE.pitcher;
      var h = '<h1>'+(changing ? 'Pitching change' : 'Who\'s pitching?')+'</h1><div class="sub" style="margin-bottom:14px;">vs '+esc(STATE.game.opponent)+'</div><div class="card">';
      STATE.cfg.pitchers.forEach(function(n){
        var c = nextNumFor(n) - 1;
        var tag = n === STATE.pitcher ? ' <span class="pill live">pitching now</span>' : (n === suggest ? ' <span class="pill live">last pitching</span>' : '');
        h += '<div class="row" onclick="startPitcher(\''+jsSafe(n)+'\')"><div class="grow"><b>'+esc(n)+'</b>'+tag+'</div>'+
             '<span class="muted" style="font-size:13px;">'+(c ? c+' pitches' : 'starts at #1')+'</span></div>';
      });
      h += '</div>';
      h += '<button class="ghost" onclick="'+(changing ? 'renderChart()' : 'showGames()')+'">‹ Back</button>';
      setApp(h);
    }
    // Next pitch # for a pitcher in THIS game: highest already saved (server,
    // queue, or this phone) + 1. A new pitcher therefore starts at #1.
    function nextNumFor(pitcher){
      var max = STATE.serverCounts[pitcher] || 0;
      loadQ().forEach(function(p){ if (p.gameId === STATE.game.id && p.pitcher === pitcher && p.num > max) max = p.num; });
      STATE.history.forEach(function(p){ if (p.pitcher === pitcher && p.num > max) max = p.num; });
      return max + 1;
    }
    function startPitcher(name){
      STATE.pitcher = name; STATE.num = nextNumFor(name);
      saveSession(); renderChart(true);
    }

    /* ======================= CHARTING: one tap per pitch ======================= */
    function renderChart(anim){
      var h = '<div class="board"><div class="who"><div class="lbl">Now pitching</div><div class="nm">'+esc(STATE.pitcher)+'</div><div class="op">vs '+esc(STATE.game.opponent)+' · Inning '+STATE.inning+'</div><span id="syncBadge" class="sync"></span></div>'+
              '<div class="pn"><div class="l">Pitch</div><div class="v">#'+STATE.num+'</div></div></div>';
      h += '<div class="card" style="padding-top:14px;">';
      h += '<div class="hm"><button class="hit" onclick="recordPitch(true)">✓ HIT SPOT</button>'+
           '<button class="mis" onclick="recordPitch(false)">✗ MISSED SPOT</button></div>';

      var mine = STATE.history.filter(function(p){ return p.pitcher === STATE.pitcher; });
      var last = mine.slice(-6).reverse();
      h += '<div class="strip">'+last.map(function(p){ return '<span class="'+(p.hit ? 'h' : 'm')+'">#'+p.num+' '+(p.hit ? 'HIT' : 'MISS')+'</span>'; }).join('')+'</div>';
      if (mine.length && STATE.user.role === 'coach'){
        var hits = mine.filter(function(p){ return p.hit; }).length;
        h += '<div class="running">Charted on this phone: '+hits+' of '+mine.length+' hit ('+Math.round(hits*100/mine.length)+'%)</div>';
      }
      h += '</div>';
      h += '<button class="ghost" style="margin-top:12px;color:var(--green-deep);border-color:var(--mist-line);background:var(--mist);font-weight:800;" onclick="nextInning()">＋ Start inning '+(STATE.inning + 1)+'</button>';
      h += '<div class="tools"><button onclick="undoLast()">↶ Undo last</button><button onclick="changePitcher()">Change pitcher</button><button onclick="handOff()">Hand off to a teammate</button><button onclick="endGame()">End game</button></div>';
      h += '<button class="ghost" style="margin-top:8px;" onclick="showFix()">✎ Fix an earlier pitch</button>';
      h += '<button class="ghost" onclick="showHome()">‹ Home (game stays open)</button>';
      setApp._next = 'chart';
      setApp(h, anim);
      renderSync();
    }
    /* ---- INNING MARKERS + WHY A PITCHER CAME OUT ---- */
    function newEventId(){ return 'E' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function sendEvent(type, value, after, done){
      var ev = { id:newEventId(), gameId:STATE.game.id, pitcher:STATE.pitcher || '', type:type, value:String(value), after:after || 0, by:STATE.user.name, ts:stamp() };
      api('pt_addEvent', ev, function(){ if (done) done(true); }, function(){ if (done) done(false); });
    }
    function nextInning(){
      var n = STATE.inning + 1;
      if (!confirm('Start inning '+n+'?')) return;
      STATE.inning = n; renderChart(true);
      sendEvent('INNING', n, STATE.num - 1, function(ok){
        if (!ok){ STATE.inning = n - 1; toast('Inning did not save. Try again.'); if (el('syncBadge')) renderChart(); }
      });
    }
    var PULL_REASONS = ['Planned change','Tired / velocity down','Struggling to hit spots','Hurt / not feeling right','Pitch or inning limit'];
    function changePitcher(){
      if (!STATE.pitcher || STATE.num <= 1) return pickPitcher();   // nothing thrown yet: no reason needed
      showPullReason('change');
    }
    function showPullReason(mode){
      var first = STATE.pitcher.split(' ')[0];
      var opts = PULL_REASONS.slice(); if (mode === 'end') opts.unshift('Finished the game');
      var h = '<h1>'+(mode === 'end' ? 'How did '+esc(first)+' finish?' : 'Why is '+esc(first)+' coming out?')+'</h1><div class="sub" style="margin-bottom:6px;">One tap. Only the coaches see this.</div><div class="card reasons">';
      opts.forEach(function(r, i){ h += '<button onclick="pullChosen(\''+mode+'\','+i+')">'+esc(r)+'</button>'; });
      h += '<button class="ghost" style="text-align:center;" onclick="pullChosen(\''+mode+'\',-1)">Skip</button></div>';
      h += '<button class="ghost" onclick="renderChart()">‹ Back to charting</button>';
      PULL_OPTS = opts; setApp(h);
    }
    var PULL_OPTS = [];
    function pullChosen(mode, i){
      var after = STATE.num - 1, go = function(){ if (mode === 'end') finishEnd(); else pickPitcher(); };
      if (i < 0){ go(); return; }
      var reason = PULL_OPTS[i];
      if (mode === 'end'){ sendEvent('PULL', reason, after, function(){ go(); }); setApp('<div class="card muted">Saving…</div>'); }
      else { sendEvent('PULL', reason, after, function(ok){ if (!ok) toast('Reason did not save.'); }); go(); }
    }
    var lastTap = 0;
    function recordPitch(hit){
      if (Date.now() - lastTap < 400) return;   // ignore accidental double-taps
      lastTap = Date.now();
      var p = {
        id: 'P' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        gameId: STATE.game.id, gameDate: STATE.game.date, opponent: STATE.game.opponent,
        pitcher: STATE.pitcher, num: STATE.num, hit: hit,
        charter: STATE.user.name, ts: stamp()
      };
      var q = loadQ(); q.push(p); saveQ(q);
      STATE.history.push(p);
      toast('Pitch #'+STATE.num+' · '+(hit ? 'HIT' : 'MISS'));
      STATE.num++;
      renderChart(true);
      syncNow();
    }
    function undoLast(){
      var last = STATE.history[STATE.history.length - 1];
      if (!last){ toast('Nothing to undo on this phone'); return; }
      if (!confirm('Undo '+last.pitcher.split(' ')[0]+'\'s pitch #'+last.num+' ('+(last.hit ? 'HIT' : 'MISS')+')?')) return;
      STATE.history.pop();
      var q = loadQ();
      if (q.some(function(p){ return p.id === last.id; })) saveQ(q.filter(function(p){ return p.id !== last.id; }));
      else api('pt_voidPitch', { pitchId:last.id }, function(){}, function(){ toast('Could not undo on the server. Tell your coach.'); });
      if (STATE.serverCounts[last.pitcher] >= last.num) STATE.serverCounts[last.pitcher] = last.num - 1;
      STATE.pitcher = last.pitcher; STATE.num = last.num;
      saveSession(); toast('Pitch #'+last.num+' removed');
      renderChart(true);
    }
    /* ---- FIX AN EARLIER PITCH ----
       Any scorer can correct any pitch in the open game (including ones a
       teammate charted). Nothing is deleted: a correction flips HIT/MISS and
       records who changed it; "Remove" voids the row like Undo does. */
    var FIX = { pitches:[], pitcher:null };
    function showFix(pitcher){
      if (pitcher) FIX.pitcher = pitcher; else if (!FIX.pitcher) FIX.pitcher = STATE.pitcher;
      setApp('<h1>Fix a pitch</h1><div class="card" style="text-align:center;"><div class="sub" id="fixMsg">Saving your latest pitches…</div></div>');
      var tries = 0;
      (function wait(){
        if (loadQ().length && ++tries <= 8){ syncNow(); setTimeout(wait, 1200); return; }
        authApi('pt_pitchLog', { gameId:STATE.game.id }, function(d){
          var server = d.data.pitches, have = {}; server.forEach(function(p){ have[p.id] = true; });
          // anything still waiting to sync on this phone is included too
          var local = loadQ().filter(function(p){ return p.gameId === STATE.game.id && !have[p.id]; })
            .map(function(p){ return { id:p.id, pitcher:p.pitcher, num:p.num, hit:p.hit, charter:p.charter, editedBy:'', local:true }; });
          FIX.pitches = server.concat(local);
          renderFix();
        }, function(err){ setApp('<h1>Fix a pitch</h1><div class="card err">'+esc(errMsg(err))+'</div><button class="ghost" onclick="renderChart()">‹ Back to charting</button>'); });
      })();
    }
    function renderFix(){
      var names = []; FIX.pitches.forEach(function(p){ if (names.indexOf(p.pitcher) === -1) names.push(p.pitcher); });
      if (names.indexOf(FIX.pitcher) === -1 && names.length) FIX.pitcher = names[names.length - 1];
      var h = '<h1>Fix a pitch</h1><div class="sub" style="margin-bottom:12px;">vs '+esc(STATE.game.opponent)+'. Tap <b>Switch</b> to change HIT / MISS, newest first.</div>';
      if (names.length > 1){
        h += '<div class="card" style="padding:10px;"><select id="fixWho" onchange="FIX.pitcher=this.value; renderFix()">'+
          names.map(function(n){ return '<option value="'+esc(n)+'"'+(n === FIX.pitcher ? ' selected' : '')+'>'+esc(n)+'</option>'; }).join('')+'</select></div>';
      }
      var mine = FIX.pitches.filter(function(p){ return p.pitcher === FIX.pitcher; }).sort(function(a, b){ return b.num - a.num; });
      h += '<div class="card">';
      if (!mine.length) h += '<div class="muted">No pitches charted yet.</div>';
      mine.forEach(function(p){
        h += '<div class="logrow"><div class="num">#'+p.num+'</div><div class="grow"><span class="tag '+(p.hit ? 'h' : 'm')+'">'+(p.hit ? 'HIT' : 'MISS')+'</span>'+
             (p.editedBy ? ' <span class="sub">fixed by '+esc(p.editedBy.split(' ')[0])+'</span>' : '')+'</div>'+
             '<button onclick="fixFlip(\''+jsSafe(p.id)+'\')">Switch to '+(p.hit ? 'MISS' : 'HIT')+'</button>'+
             '<button class="rm" onclick="fixRemove(\''+jsSafe(p.id)+'\','+p.num+')" aria-label="remove pitch">✕</button></div>';
      });
      h += '</div><button class="big navy" onclick="renderChart()">Done · back to charting</button>';
      setApp(h);
    }
    function fixFind(id){ for (var i = 0; i < FIX.pitches.length; i++) if (FIX.pitches[i].id === id) return FIX.pitches[i]; return null; }
    function fixApplyLocal(id, hit){
      var q = loadQ(); q.forEach(function(p){ if (p.id === id) p.hit = hit; }); saveQ(q);
      STATE.history.forEach(function(p){ if (p.id === id) p.hit = hit; });
    }
    function fixFlip(id){
      var p = fixFind(id); if (!p) return;
      var hit = !p.hit;
      if (p.local){
        fixApplyLocal(id, hit); p.hit = hit; p.editedBy = STATE.user.name; renderFix(); return;
      }
      authApi('pt_editPitch', { pitchId:id, hit:hit }, function(d){
        if (!d.data.edited){ alert('That pitch could not be found. Reopen this screen.'); return; }
        p.hit = hit; p.editedBy = STATE.user.name; fixApplyLocal(id, hit); toast('Pitch #'+p.num+' is now '+(hit ? 'HIT' : 'MISS')); renderFix();
      }, function(err){ alert(errMsg(err)); });
    }
    function fixRemove(id, num){
      if (!confirm('Remove pitch #'+num+'? It will stop counting. (Later pitches keep their numbers.)')) return;
      var p = fixFind(id); if (!p) return;
      function done(){
        FIX.pitches = FIX.pitches.filter(function(x){ return x.id !== id; });
        STATE.history = STATE.history.filter(function(x){ return x.id !== id; });
        toast('Pitch #'+num+' removed'); renderFix();
      }
      if (p.local){ saveQ(loadQ().filter(function(x){ return x.id !== id; })); done(); return; }
      authApi('pt_removePitch', { pitchId:id }, done, function(err){ alert(errMsg(err)); });
    }

    // Scorer is going into the game. Push every pitch to the server first so
    // the next scorer's phone sees the right pitch number, then sign out.
    function handOff(){
      if (!confirm('Hand off scoring? Your pitches will finish saving, then a teammate can log in and pick up this game.')) return;
      setApp('<div class="card" style="text-align:center;"><h2>Saving your pitches…</h2><div class="sub" id="hoMsg">Keep the app open.</div></div>');
      var tries = 0;
      (function wait(){
        var n = loadQ().length;
        if (!n){
          var opp = STATE.game.opponent;
          clearSession(); STATE.game = null; STATE.pitcher = null; STATE.history = []; STATE.user = null; STATE.pin = null;
          setApp('<div class="card" style="text-align:center;"><h1>All saved ✓</h1>'+
            '<div class="sub" style="margin:8px 0 4px;">Your teammate logs in, taps <b>Chart a game</b>, then <b>Join</b> on the game vs '+esc(opp)+'.</div>'+
            '<button class="big" onclick="showLogin()">Log in as the next scorer</button></div>');
          return;
        }
        if (el('hoMsg')) el('hoMsg').textContent = n+' pitch'+(n === 1 ? '' : 'es')+' still saving… keep the app open.';
        if (++tries > 40){
          setApp('<div class="card"><h2>Still not saved</h2><div class="sub">'+n+' pitches are waiting for signal. Hand this phone to your teammate instead, or try again when you have signal.</div>'+
            '<button class="big" onclick="handOff()">Try again</button><button class="ghost" onclick="renderChart()">‹ Back to charting</button></div>');
          return;
        }
        syncNow(); setTimeout(wait, 1500);
      })();
    }
    function endGame(){
      if (loadQ().length){ alert('Some pitches are still waiting to sync. Keep the app open a moment, then try again.'); syncNow(); return; }
      if (!confirm('End the game vs '+STATE.game.opponent+'?')) return;
      if (STATE.pitcher && STATE.num > 1) showPullReason('end'); else finishEnd();
    }
    function finishEnd(){
      api('pt_endGame', { gameId:STATE.game.id }, function(){
        var gid = STATE.game.id;
        clearSession(); STATE.game = null; STATE.pitcher = null; STATE.history = [];
        toast('Game ended');
        if (STATE.user.role === 'coach'){ REPORT_BACK = 'showGameList()'; showReport(gid); } else showHome();
      }, function(err){ alert(errMsg(err)); });
    }

    /* ======================= STATS ======================= */
    function showPitcher(name, back){
      setApp('<h1>'+esc(name)+'</h1><div class="card muted">Crunching the numbers…</div>');
      authApi('pt_pitcherStats', { pitcher:name }, function(d){
        var s = d.data.summary;
        var h = '<h1>'+esc(name)+'</h1><div class="sub" style="margin-bottom:14px;">This season (since '+esc(niceDate(d.data.seasonStart))+')</div>';
        var isCoach = STATE.user.role === 'coach', reload = 'showPitcher(\''+jsSafe(name)+'\''+(back ? ',\''+jsSafe(back)+'\'' : '')+')';
        var notes = d.data.notes || [];
        if (notes.length || isCoach){
          h += '<div class="card"><h2>'+(isCoach ? 'Notes for '+esc(name.split(' ')[0]) : 'From your coaches')+'</h2>'+(notes.length ? notesHtml(notes, isCoach, reload, true) : '<div class="sub">No notes yet.</div>')+(isCoach ? noteForm(name, '', reload) : '')+'</div>';
        }
        if (!s.n){ h += '<div class="card muted">No pitches charted yet this season.</div>'; }
        else {
          h += summaryCards(s, d.data.games.length);
          h += trendHtml('Trend', 'Hit-spot % in each game', d.data.games.slice().reverse().map(function(g){ return { label:shortDate(g.date), pct:g.pct, n:g.n }; }));
          h += '<div class="card"><h2>Game by game</h2><table class="t"><tr><th>Game</th><th>Pitches</th><th>Hit spot</th></tr>';
          d.data.games.forEach(function(g){
            h += '<tr class="click" onclick="showReport(\''+jsSafe(g.gameId)+'\',\''+jsSafe(name)+'\')"><td><b>vs '+esc(g.opponent || '?')+'</b><div class="sub">'+esc(niceDate(g.date))+'</div></td><td>'+g.n+'</td><td><b>'+pct(g.pct)+'</b></td></tr>';
          });
          h += '</table></div>';
        }
        h += '<button class="ghost" onclick="'+(back || 'showHome()')+'">‹ Back</button>';
        setApp(h);
      }, function(err){ setApp('<div class="card err">'+esc(errMsg(err))+'</div><button class="ghost" onclick="showHome()">‹ Back</button>'); });
    }
    function summaryCards(s, games){
      var h = '<div class="card"><div class="kpis">'+
        '<div class="kpi hero"><div class="v">'+pct(s.pct)+'</div><div class="l">Hit spot</div></div>'+
        '<div class="kpi"><div class="v">'+s.hits+'/'+s.n+'</div><div class="l">Hits / pitches</div></div>'+
        (games !== undefined ? '<div class="kpi"><div class="v">'+games+'</div><div class="l">Games</div></div>'
                             : '<div class="kpi"><div class="v">'+(s.n - s.hits)+'</div><div class="l">Misses</div></div>')+
        '</div>';
      if (s.fadeAt) h += '<div class="callout warn">Accuracy dropped off starting around <b>pitch '+s.fadeAt+'</b>.</div>';
      h += '</div>';
      if (s.blocks.length > 1){
        h += '<div class="card"><h2>As the pitch count climbs</h2><div class="sub" style="margin-bottom:6px;">Does accuracy hold up deeper into the game?</div><div class="bars">';
        s.blocks.forEach(function(b){ h += bar('Pitches '+b.from+'–'+b.to, b.pct, b.hits+'/'+b.n); });
        h += '</div></div>';
      }
      return h;
    }
    function bar(label, p, right){
      var w = p === null ? 0 : p;
      return '<div class="b"><div>'+esc(label)+'</div><div class="track"><div class="fill'+(w < 50 ? ' low' : '')+'" style="width:'+w+'%"></div></div><div class="n"><b>'+pct(p)+'</b> '+esc(String(right))+'</div></div>';
    }

    /* ---- coach: staff + game reports ---- */
    /* ---- RESULTS (coach): team totals, season by pitcher, and game-by-game grid ---- */
    function cellBg(p){
      if (p === null || p === undefined) return '';
      if (p < 50) return 'background:rgba(192,57,43,'+(0.10 + (50 - p) / 50 * 0.22).toFixed(2)+');';
      return 'background:rgba(7,125,64,'+(0.08 + (p - 50) / 50 * 0.36).toFixed(2)+');';
    }
    function showStaff(tab){
      if (tab) STATE.resTab = tab;
      var T = STATE.resTab || 'season';
      REPORT_BACK = 'showStaff()';
      setApp('<h1>Results</h1><div class="card muted">Loading…</div>');
      authApi('pt_results', {}, function(d){
        var r = d.data, first = function(n){ return n.split(' ')[0]; };
        var h = '<h1>Results</h1><div class="sub" style="margin-bottom:14px;">Season since '+esc(niceDate(r.seasonStart))+'. Games switched off are not counted.</div>';
        h += '<div class="card"><div class="kpis">'+
          '<div class="kpi hero"><div class="v">'+pct(r.team.pct)+'</div><div class="l">Team hit spot</div></div>'+
          '<div class="kpi"><div class="v">'+r.team.n+'</div><div class="l">Pitches</div></div>'+
          '<div class="kpi"><div class="v">'+r.team.games+'</div><div class="l">Games</div></div></div></div>';
        h += '<div class="seg"><button class="'+(T === 'season' ? 'on' : '')+'" onclick="showStaff(\'season\')">Season by pitcher</button>'+
             '<button class="'+(T === 'games' ? 'on' : '')+'" onclick="showStaff(\'games\')">Game by game</button></div>';

        if (T === 'season'){
          h += trendHtml('Team trend', 'Team hit-spot % in each counted game', r.games.filter(function(g){ return !g.excluded && g.team && g.team.n; }).slice().reverse().map(function(g){ return { label:shortDate(g.date), pct:g.team.pct, n:g.team.n }; }));
          h += '<div class="card">';
          if (!r.team.n) h += '<div class="muted">No pitches charted yet.</div>';
          else {
            h += '<table class="t"><tr><th>Pitcher</th><th>Pitches</th><th>Hit spot</th><th>Last game</th></tr>';
            r.season.forEach(function(p){
              h += '<tr class="click" onclick="showPitcher(\''+jsSafe(p.pitcher)+'\',\'showStaff()\')"><td><b>'+esc(p.pitcher)+'</b><div class="sub">'+p.games+' game'+(p.games === 1 ? '' : 's')+'</div></td><td>'+p.n+'</td><td><b>'+pct(p.pct)+'</b></td><td>'+(p.lastN ? pct(p.lastPct) : '—')+'</td></tr>';
            });
            h += '<tr><td><b>Team</b><div class="sub">'+r.team.games+' game'+(r.team.games === 1 ? '' : 's')+'</div></td><td><b>'+r.team.n+'</b></td><td><b>'+pct(r.team.pct)+'</b></td><td></td></tr>';
            h += '</table><div class="sub" style="margin-top:8px;">Tap a pitcher for her full breakdown.</div>';
          }
          h += '</div>';
        } else {
          h += '<div class="card" style="padding:12px 10px;">';
          if (!r.games.length) h += '<div class="muted" style="padding:6px;">No pitches charted yet.</div>';
          else {
            h += '<div class="mxwrap"><table class="mx"><tr><th class="g">Game</th>';
            r.pitchers.forEach(function(n){ h += '<th class="p" onclick="showPitcher(\''+jsSafe(n)+'\',\'showStaff()\')">'+esc(first(n))+'</th>'; });
            h += '<th class="team">Team</th></tr>';
            // season row first
            h += '<tr class="season"><td class="g">Season</td>';
            r.season.forEach(function(p){ h += '<td class="c" style="'+cellBg(p.pct)+'">'+(p.n ? '<b>'+pct(p.pct)+'</b><small>'+p.hits+'/'+p.n+'</small>' : '—')+'</td>'; });
            h += '<td class="c team" style="'+cellBg(r.team.pct)+'">'+(r.team.n ? '<b>'+pct(r.team.pct)+'</b><small>'+r.team.hits+'/'+r.team.n+'</small>' : '—')+'</td></tr>';
            r.games.forEach(function(g){
              h += '<tr class="game'+(g.excluded ? ' off' : '')+'" onclick="showReport(\''+jsSafe(g.id)+'\')"><td class="g"><div class="gname">vs '+esc(g.opponent)+'</div><div class="gsub">'+esc(niceDate(g.date))+(g.excluded ? ' · not counted' : (g.status === 'open' ? ' · live' : ''))+'</div></td>';
              r.pitchers.forEach(function(n){
                var c = g.cells[n];
                h += c ? '<td class="c" style="'+cellBg(c.pct)+'"><b>'+pct(c.pct)+'</b><small>'+c.hits+'/'+c.n+'</small></td>' : '<td class="c"><span class="muted">—</span></td>';
              });
              h += '<td class="c team" style="'+cellBg(g.team.pct)+'"><b>'+pct(g.team.pct)+'</b><small>'+g.team.hits+'/'+g.team.n+'</small></td></tr>';
            });
            h += '</table></div><div class="sub" style="margin-top:8px;padding:0 4px;">Each cell is hit-spot % with hits/pitches. Tap a game for its report, a pitcher name for her breakdown. Swipe sideways for more.</div>';
          }
          h += '</div>';
        }
        h += '<button class="ghost" onclick="showHome()">‹ Back</button>';
        setApp(h);
      }, function(err){ setApp('<div class="card err">'+esc(errMsg(err))+'</div><button class="ghost" onclick="showHome()">‹ Back</button>'); });
    }
    function showGameList(){
      REPORT_BACK = 'showGameList()';
      setApp('<h1>Game reports</h1><div class="card muted">Loading…</div>');
      api('pt_games', {}, function(d){
        var h = '<h1>Games &amp; teams</h1><div class="sub" style="margin-bottom:14px;">Every game we have charted. Tap a game for its report. Use the switch to choose whether it counts in season stats, or the trash can to delete a game for good.</div><div class="card">';
        if (!d.data.length) h += '<div class="muted">No games yet.</div>';
        else h += '<div class="legend"><span>Game</span><span>Counts in stats</span></div>';
        d.data.forEach(function(g){
          var on = !g.excluded;
          h += '<div class="row'+(on ? '' : ' off')+'" onclick="showReport(\''+jsSafe(g.id)+'\')"><div class="grow"><b>vs '+esc(g.opponent)+'</b><div class="sub">'+esc(niceDate(g.date))+' · '+(g.status === 'open' ? 'in progress' : 'final')+'</div></div>'+
               '<button aria-label="delete game" style="border:0;background:none;color:#b3261e;font-size:20px;padding:6px 10px;" onclick="event.stopPropagation(); deleteGame(\''+jsSafe(g.id)+'\',\''+jsSafe(g.opponent)+'\')">🗑</button>'+'<button class="toggle'+(on ? ' on' : '')+'" aria-label="counts in season stats" onclick="event.stopPropagation(); toggleCounts(\''+jsSafe(g.id)+'\','+on+')"><span class="knob"></span></button></div>';
        });
        h += '</div><button class="ghost" onclick="showHome()">‹ Back</button>';
        setApp(h);
      }, function(err){ setApp('<div class="card err">'+esc(errMsg(err))+'</div><button class="ghost" onclick="showHome()">‹ Back</button>'); });
    }
    // currentlyCounted=true means this tap turns counting OFF.
    function toggleCounts(id, currentlyCounted){
      authApi('pt_excludeGame', { gameId:id, excluded:currentlyCounted },
        function(){ toast(currentlyCounted ? 'Game no longer counted' : 'Game counted again'); showGameList(); },
        function(err){ alert(errMsg(err)); showGameList(); });
    }
    // onlyPitcher: players see just their own line from a game, never teammates'.
    /* ---- coach notes (shown to the pitcher they are about) ---- */
    function notesHtml(notes, canEdit, reload, showGame){
      var h = '';
      notes.forEach(function(n){
        h += '<div class="note">'+esc(n.text)+'<div class="by"><span>'+esc(n.by)+' · '+esc(niceDate(String(n.ts).slice(0,10)))+(showGame && n.gameLabel ? ' · '+esc(n.gameLabel) : '')+'</span>'+
             (canEdit ? '<button class="x" aria-label="remove note" onclick="removeNote(\''+jsSafe(n.id)+'\',\''+jsSafe(reload)+'\')">✕</button>' : '')+'</div></div>';
      });
      return h;
    }
    function noteForm(pitcher, gameId, reload){
      var id = 'nt_'+(gameId||'all')+'_'+pitcher.replace(/\W/g,'');
      return '<div style="margin-top:10px;"><textarea id="'+id+'" placeholder="Note for '+esc(pitcher.split(' ')[0])+' (she will see this)"></textarea>'+
             '<button class="ghost" style="margin-top:6px;" onclick="addNote(\''+jsSafe(pitcher)+'\',\''+jsSafe(gameId||'')+'\',\''+id+'\',\''+jsSafe(reload)+'\')">Save note</button></div>';
    }
    function addNote(pitcher, gameId, fieldId, reload){
      var t = el(fieldId).value.trim(); if (!t){ toast('Type a note first'); return; }
      authApi('pt_addNote', { pitcher:pitcher, gameId:gameId, text:t }, function(){ toast('Note saved'); eval(reload); }, function(err){ alert(errMsg(err)); });
    }
    function removeNote(id, reload){
      if (!confirm('Remove this note?')) return;
      authApi('pt_removeNote', { noteId:id }, function(){ toast('Note removed'); eval(reload); }, function(err){ alert(errMsg(err)); });
    }
    /* ---- pitch-by-pitch register ---- */
    function registerHtml(log){
      if (!log || !log.length) return '';
      var groups = [], idx = {};
      log.forEach(function(x){ if (idx[x.inning] === undefined){ idx[x.inning] = groups.length; groups.push({ inning:x.inning, items:[] }); } groups[idx[x.inning]].items.push(x); });
      var h = '<div class="card"><h2>Pitch by pitch</h2><div class="sub">Green = hit the spot, red = missed it.</div>';
      groups.forEach(function(g){
        var hits = g.items.filter(function(x){ return x.hit; }).length;
        if (groups.length > 1) h += '<div class="reghd"><span>Inning '+g.inning+'</span><span>'+hits+' of '+g.items.length+'</span></div>';
        h += '<div class="reg">'+g.items.map(function(x){ return '<span class="'+(x.hit ? 'h' : 'm')+'">#'+x.n+' '+(x.hit ? '✓' : '✗')+'</span>'; }).join('')+'</div>';
      });
      return h + '</div>';
    }
    /* ---- trend line (hit % game to game) ---- */
    // points: oldest first, [{label, pct, n}]
    function trendHtml(title, sub, points){
      points = points.filter(function(p){ return p.pct !== null && p.pct !== undefined; });
      var h = '<div class="card"><h2>'+esc(title)+'</h2><div class="sub">'+esc(sub)+'</div>';
      if (points.length < 2){ return h + '<div class="muted" style="margin-top:8px;">The trend shows up after the second game.</div></div>'; }
      var W = 320, H = 160, L = 34, R = 14, T = 12, B = 28, pw = W - L - R, ph = H - T - B;
      var vals = points.map(function(p){ return p.pct; });
      var lo = Math.max(0, Math.floor((Math.min.apply(null, vals) - 10) / 10) * 10), hi = Math.min(100, Math.ceil((Math.max.apply(null, vals) + 10) / 10) * 10);
      while (hi - lo < 30){ if (lo > 0) lo -= 10; if (hi - lo < 30 && hi < 100) hi += 10; }
      var ticks = [], tstep = (hi - lo) > 60 ? 25 : 10; for (var t = lo; t <= hi; t += tstep) ticks.push(t);
      var X = function(i){ return L + 16 + i * (pw - 32) / (points.length - 1); };
      var Y = function(v){ return T + ph - ((v - lo) / (hi - lo)) * ph; };
      var s = '<svg class="trend" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Hit spot percent by game">';
      ticks.forEach(function(g){
        s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="#E3E5F0" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-size="10" fill="#6b6f8f">'+g+'%</text>';
      });
      s += '<polyline fill="none" stroke="#077D40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+points.map(function(p,i){ return X(i)+','+Y(p.pct); }).join(' ')+'"/>';
      var step = Math.ceil(points.length / 6);
      points.forEach(function(p, i){
        var last = i === points.length - 1;
        s += '<circle cx="'+X(i)+'" cy="'+Y(p.pct)+'" r="'+(last ? 5 : 4)+'" fill="'+(last ? '#19144E' : '#077D40')+'" stroke="#fff" stroke-width="2"/>';
        if (last || points.length <= 8) s += '<text x="'+X(i)+'" y="'+(Y(p.pct) - 9)+'" text-anchor="middle" font-size="10.5" font-weight="800" fill="#19144E">'+p.pct+'%</text>';
        if (i % step === 0 || last) s += '<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="#6b6f8f">'+esc(p.label)+'</text>';
      });
      var first = points[0].pct, lastp = points[points.length-1].pct, diff = lastp - first;
      h += s + '</svg><div class="sub" style="margin-top:6px;text-align:center;">'+(diff > 0 ? '▲ up '+diff+' points since the first game' : (diff < 0 ? '▼ down '+(-diff)+' points since the first game' : 'Holding steady since the first game'))+'</div></div>';
      return h;
    }
    function shortDate(iso){ var m = String(iso).match(/^\d{4}-(\d{2})-(\d{2})/); return m ? (Number(m[1])+'/'+Number(m[2])) : ''; }
    function inningsHtml(list){
      if (!list || list.length < 2) return '';
      var h = '<div class="card"><h2>By inning</h2><div class="bars">';
      list.forEach(function(r){ h += bar('Inning '+r.inning, r.pct, r.hits+'/'+r.n); });
      return h + '</div></div>';
    }

    /* ---- LIVE GAME (coach) ---- */
    var LIVE = { id:null, timer:null };
    function stopLive(){ if (LIVE.timer){ clearInterval(LIVE.timer); LIVE.timer = null; } LIVE.id = null; }
    function showLive(){
      stopLive();
      setApp('<h1>Live game</h1><div class="card muted">Looking for games in progress…</div>');
      api('pt_games', {}, function(d){
        var open = d.data.filter(function(g){ return g.status === 'open'; });
        if (open.length === 1) return showLiveGame(open[0].id);
        var h = '<h1>Live game</h1>';
        if (!open.length) h += '<div class="card muted">No game is in progress right now.</div>';
        else {
          h += '<div class="card"><h2>Pick a game</h2>';
          open.forEach(function(g){ h += '<div class="row" onclick="showLiveGame(\''+jsSafe(g.id)+'\')"><div class="grow"><b>vs '+esc(g.opponent)+'</b><div class="sub">'+esc(niceDate(g.date))+'</div></div><span class="pill live">Watch</span></div>'; });
          h += '</div>';
        }
        setApp(h + '<button class="ghost" onclick="showHome()">‹ Back</button>');
      }, function(err){ setApp('<div class="card err">'+esc(errMsg(err))+'</div><button class="ghost" onclick="showHome()">‹ Back</button>'); });
    }
    function showLiveGame(id){
      stopLive(); LIVE.id = id;
      var tick = function(){
        if (LIVE.id !== id || !el('liveRoot')){ stopLive(); return; }
        authApi('pt_live', { gameId:id }, function(d){ if (LIVE.id === id && el('liveRoot')) drawLive(d.data); }, function(){ var s = el('liveStamp'); if (s) s.textContent = 'No signal. Trying again…'; }, { tries:1 });
      };
      setApp('<div id="liveRoot"><h1>Live game</h1><div class="card muted">Loading…</div></div>');
      tick(); LIVE.timer = setInterval(tick, 10000);
    }
    function drawLive(d){
      var h = '<h1>vs '+esc(d.game.opponent)+'</h1><div class="sub" style="margin-bottom:12px;">Inning '+d.inning+' · '+(d.game.status === 'open' ? 'live' : 'final')+' · <span id="liveStamp">updated '+new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit', second:'2-digit'})+'</span></div>';
      if (!d.pitchers.length) h += '<div class="card muted">No pitches charted yet.</div>';
      d.pitchers.slice().sort(function(a,b){ return (b.current?1:0) - (a.current?1:0); }).forEach(function(p){
        h += '<div class="card livecard'+(p.current ? ' cur' : '')+'"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><b style="font-size:17px;color:var(--navy);">'+esc(p.pitcher)+'</b>'+
             (p.current ? '<span class="pill live">pitching now</span>' : (p.pulled ? '<span class="pill">out after #'+p.pulled.after+'</span>' : '<span class="pill">done</span>'))+'</div>'+
             '<div class="kpis" style="margin-top:10px;"><div class="kpi hero"><div class="v">'+pct(p.pct)+'</div><div class="l">Hit spot</div></div><div class="kpi"><div class="v">'+p.hits+'/'+p.n+'</div><div class="l">Hits / pitches</div></div><div class="kpi"><div class="v">'+p.last5.hits+'/'+p.last5.n+'</div><div class="l">Last 5</div></div></div>'+
             '<div class="dots">'+p.seq.map(function(x){ return '<i class="'+(x ? 'h' : '')+'"></i>'; }).join('')+'</div><div class="sub" style="text-align:center;">last '+p.seq.length+' pitches, newest on the right</div>';
        if (p.alert === 'red') h += '<div class="callout warn">Missing spots: <b>'+p.last5.hits+' of the last 5</b>. Time to check in?</div>';
        else if (p.alert === 'amber') h += '<div class="callout warn" style="background:#FFF6E0;border-color:#F1E3A6;color:#7a5a00;">Slipping: <b>'+p.last10.hits+' of the last 10</b>.</div>';
        if (p.pulled) h += '<div class="sub" style="margin-top:8px;">Came out: '+esc(p.pulled.reason)+'</div>';
        h += '</div>';
      });
      h += '<button class="ghost" onclick="stopLive();showHome()">‹ Back</button>';
      el('liveRoot').innerHTML = h;
    }

    var REPORT_BACK = 'showGameList()';   // where a coach's report goes back to (Results grid or the games list)
    function showReport(gameId, onlyPitcher){
      setApp('<h1>Game report</h1><div class="card muted">Loading…</div>');
      authApi('pt_gameReport', { gameId:gameId }, function(d){
        var g = d.data.game;
        var list = d.data.pitchers.filter(function(p){ return !onlyPitcher || p.pitcher === onlyPitcher; });
        var h = '<h1>vs '+esc(g.opponent)+'</h1><div class="sub" style="margin-bottom:14px;">'+esc(niceDate(g.date))+(g.status === 'open' ? ' · in progress' : '')+'</div>';
        if (g.excluded) h += '<div class="callout warn" style="margin:0 0 12px;">This game is <b>not counted</b> in season stats. The pitches are still saved.</div>';
        if (!list.length) h += '<div class="card muted">No pitches charted in this game.</div>';
        list.forEach(function(p){
          h += '<div style="font-size:17px;font-weight:900;color:var(--navy);margin:18px 2px 8px;">'+esc(p.pitcher)+'</div>' + summaryCards(p.summary);
          h += registerHtml(p.log);
          h += inningsHtml(p.innings);
          if (p.pulled && STATE.user.role === 'coach') h += '<div class="callout" style="background:#FFFBEA;border-color:#F1E3A6;color:#7a5a00;margin:0 0 12px;">Came out after pitch <b>'+p.pulled.after+'</b>: '+esc(p.pulled.reason)+'</div>';
          var rl = 'showReport(\''+jsSafe(g.id)+'\''+(onlyPitcher ? ',\''+jsSafe(onlyPitcher)+'\'' : '')+')';
          if ((p.notes && p.notes.length) || STATE.user.role === 'coach'){
            h += '<div class="card"><h2>Coach notes</h2>'+(p.notes && p.notes.length ? notesHtml(p.notes, STATE.user.role === 'coach', rl, false) : '<div class="sub">No notes for this game yet.</div>')+
                 (STATE.user.role === 'coach' ? noteForm(p.pitcher, g.id, rl) : '')+'</div>';
          }
        });
        var back = onlyPitcher ? 'showPitcher(\''+jsSafe(onlyPitcher)+'\')' : REPORT_BACK;
        if (STATE.user.role === 'coach') h += '<button class="ghost" onclick="setExcluded(\''+jsSafe(g.id)+'\','+(g.excluded ? 'false' : 'true')+')">'+(g.excluded ? 'Count this game in season stats again' : 'Don\'t count this game in season stats')+'</button>';
        if (STATE.user.role === 'coach') h += '<button class="ghost" style="color:#b3261e;border-color:#e6b8b4;" onclick="deleteGame(\''+jsSafe(g.id)+'\',\''+jsSafe(g.opponent)+'\')">Delete this game permanently</button>';
        if (STATE.user.role === 'coach' && g.status === 'final') h += '<button class="ghost" onclick="reopenGame(\''+jsSafe(g.id)+'\')">Reopen this game for charting</button>';
        h += '<button class="ghost" onclick="'+back+'">‹ Back</button>';
        setApp(h);
      }, function(err){ setApp('<div class="card err">'+esc(errMsg(err))+'</div><button class="ghost" onclick="showHome()">‹ Back</button>'); });
    }
    function setExcluded(id, makeExcluded){
      var msg = makeExcluded ? 'Stop counting this game in season stats? Nothing is deleted, and you can turn it back on any time.' : 'Count this game in season stats again?';
      if (!confirm(msg)) return;
      authApi('pt_excludeGame', { gameId:id, excluded:makeExcluded }, function(){ toast(makeExcluded ? 'Game no longer counted' : 'Game counted again'); showReport(id); }, function(err){ alert(errMsg(err)); });
    }
    function deleteGame(id, opp){
      if (!confirm('PERMANENTLY delete the game vs '+opp+' and all of its pitches? This cannot be undone.\n\n(To keep it but stop counting it, use the switch instead.)')) return;
      authApi('pt_deleteGame', { gameId:id }, function(){ toast('Game deleted'); eval(REPORT_BACK); }, function(err){ alert(errMsg(err)); });
    }
    function reopenGame(id){ authApi('pt_reopenGame', { gameId:id }, function(){ toast('Game reopened'); showReport(id); }, function(err){ alert(errMsg(err)); }); }

    /* ======================= HELPERS ======================= */
    function pct(p){ return p === null || p === undefined ? '—' : p + '%'; }
    function pad(n){ return (n < 10 ? '0' : '') + n; }
    function todayIso(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    function stamp(){ var d = new Date(); return todayIso()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
    function niceDate(iso){
      var p = String(iso || '').split('-'); if (p.length < 3) return iso || '';
      var d = new Date(+p[0], +p[1]-1, +p[2]);
      return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+', '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getDate();
    }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function jsSafe(s){ return esc(String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
    function errMsg(err){ return err && err.message ? err.message : String(err); }

    showLogin();
  </script>
</body>
